[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-extras-toolkit"
version = "1.0.0"
description = "CTF extras: LSB steganography and writeup generator"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jimit Devangkumar Parikh" }]

[project.urls]
Homepage = "https://github.com/JIMIT-PARIKH-01/ctf-extras-toolkit"

[project.scripts]
ctfextras = "ctfextras.cli:main"

[tool.setuptools]
packages = ["ctfextras"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
